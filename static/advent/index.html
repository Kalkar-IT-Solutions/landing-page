<style>
:root{
  --bg:#1d1913; --bg2:#2a241b; --card:#f1f1ec; --ink:#2a241b; --muted:#8a8b84;
  --bronze:#b8956a; --bronze2:#92785a; --bronze3:#7a6248; --line:#e3e3dc;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#3a3024 0%,var(--bg) 60%);color:var(--card);font-family:var(--sans);overflow-x:hidden}
#snow{position:fixed;inset:0;pointer-events:none;z-index:9}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 18px 60px}
header{text-align:center;margin-bottom:16px;grid-column:1/-1}
.kicker{color:var(--bronze);letter-spacing:.08em;font-size:.85rem}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.2rem,7vw,4rem);margin:.2em 0 .1em;line-height:1.05}
h1 em{color:var(--bronze);font-style:italic}
.lead{color:#cfc8bb;max-width:34rem;margin:0 auto;line-height:1.5}
.count{margin-top:14px;font-size:.9rem;color:var(--bronze)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:dense;gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(6,1fr);gap:14px}}
.door{position:relative;aspect-ratio:3/4;perspective:800px;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit}
/* Lückenlos: 24 ist 2×2, 1 ist breit → 28 Felder = 4×7; am Desktop 12 und 18 zusätzlich breit → 30 = 6×5 */
.door.big{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.door.wide{grid-column:span 2;aspect-ratio:auto}
@media(min-width:720px){.door.wide-d{grid-column:span 2;aspect-ratio:auto}}
.door.big .motif{left:4%;right:4%;top:6%;bottom:20%;width:auto}
.door .inner{position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,var(--bronze3),#4d3e2d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.door .inner::after{content:attr(data-peek);position:absolute;inset:0;display:grid;place-items:center;font-size:2rem}
.door .leaf{position:absolute;inset:0;border-radius:14px;background:linear-gradient(155deg,var(--bronze) 0%,var(--bronze2) 100%);transform-origin:left center;transition:transform .7s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;display:flex;align-items:flex-end;justify-content:flex-start;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.18);backface-visibility:hidden}
.door .leaf::before{content:"";position:absolute;inset:6px;border:1px dashed rgba(255,255,255,.25);border-radius:9px}
.door .motif{position:absolute;left:12%;right:12%;top:10%;bottom:calc(14px + clamp(1.6rem,5vw,2.4rem));display:flex;align-items:center;justify-content:center;pointer-events:none}
.door .motif svg{width:100%;height:100%;fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.door .motif .snow{fill:#fff;stroke:none}
.door .num{font-family:var(--serif);font-size:clamp(1.6rem,5vw,2.4rem);color:#fff;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.door.locked{cursor:not-allowed}
.door.locked .leaf{filter:saturate(.4) brightness(.75)}
.door.locked .leaf::after{content:"🔒";position:absolute;top:8px;right:10px;font-size:.8rem;opacity:.7}
.door.open .leaf{transform:rotateY(-105deg);box-shadow:none}
.door.today .leaf{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(184,149,106,.45),0 6px 18px rgba(0,0,0,.35)}}
@media(hover:hover){.door:not(.locked):hover .leaf{transform:rotateY(-12deg)}
.door.open:hover .leaf{transform:rotateY(-105deg)}}
.door:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:14px}
footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:36px;line-height:1.6}
footer a{color:var(--bronze)}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(15,12,8,.72);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}
.backdrop.show{display:flex}
@media(min-width:600px){.backdrop{align-items:center;padding:24px}}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:26px 24px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media(min-width:600px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .day{color:var(--bronze2);font-size:.85rem;letter-spacing:.05em}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:.15em 0 .5em;line-height:1.15}
.sheet .emoji{font-size:3rem;line-height:1}
.sheet p{line-height:1.55;margin:.6em 0}
.sheet .actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{border:0;border-radius:999px;padding:11px 20px;font:600 .95rem var(--sans);cursor:pointer;background:var(--line);color:var(--ink)}
.btn.primary{background:var(--bronze2);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer}
.opt.right{background:#e4efdf;border-color:#8fb487}
.opt.wrong{background:#f4e1dc;border-color:#d39a8b}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font:inherit}
.meter{height:8px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--bronze2);transition:width .3s,background .3s}
kbd{background:#fff;border:1px solid #cfcfc6;border-bottom-width:3px;border-radius:7px;padding:2px 8px;font:600 .9rem var(--sans)}
.big-emoji{font-size:4rem;text-align:center;margin:10px 0;cursor:pointer;user-select:none;transition:transform .15s}
.big-emoji:active{transform:scale(.9)}
.muted{color:var(--muted);font-size:.9rem}

/* weihnachtliches Fenster: Girlande oben, Emoji als Kugel, Stern als Wasserzeichen */
.sheet{position:relative;padding-top:44px;background:linear-gradient(180deg,#f7f3ea 0%,var(--card) 140px)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;border-radius:inherit;border-bottom-left-radius:0;border-bottom-right-radius:0;
 background:
  radial-gradient(circle at 50% 16px,#b8323a 5px,transparent 5.5px) 0 0/48px 30px repeat-x,
  radial-gradient(circle at 50% 16px,#e1b04a 5px,transparent 5.5px) 16px 0/48px 30px repeat-x,
  radial-gradient(circle at 50% 16px,#2f5d45 5px,transparent 5.5px) 32px 0/48px 30px repeat-x,
  radial-gradient(120% 22px at 50% -6px,#2f5d45 60%,transparent 62%) 0 0/24px 14px repeat-x,
  linear-gradient(#2f5d45,#2f5d45) 0 0/100% 7px no-repeat}
.sheet::after{content:"✦";position:absolute;right:18px;bottom:6px;font-size:7rem;line-height:1;color:var(--bronze);opacity:.08;pointer-events:none}
.sheet .emoji{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;background:radial-gradient(circle at 35% 30%,#fff,#efe6d4 70%);box-shadow:0 0 0 3px var(--bronze),0 6px 14px rgba(0,0,0,.15);margin-bottom:12px;position:relative}
.sheet .emoji::before{content:"";position:absolute;top:-9px;left:50%;width:12px;height:8px;margin-left:-6px;border-radius:3px 3px 1px 1px;background:var(--bronze2)}
.sheet .day{color:#b8323a;font-weight:600}
.sheet ul{padding-left:1.2em}.sheet li{margin:.3em 0;line-height:1.5}
.sheet .box{background:#fffdf8}

/* Öffnen: Licht aus der Tür, Fenster fliegt aus der Tür heraus, Inhalt kommt nacheinander */
.door .inner::before{content:"";position:absolute;inset:0;border-radius:14px;background:radial-gradient(circle at 50% 50%,rgba(255,226,160,.95),rgba(255,200,110,.35) 45%,transparent 70%);opacity:0;transition:opacity .5s .15s}
.door.open .inner::before{opacity:1}
.door.glow .inner::after{animation:peek .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes peek{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.door.glow{z-index:3}
.door.glow .inner{box-shadow:0 0 30px 8px rgba(255,210,130,.55);transition:box-shadow .4s}
.backdrop{transition:background .35s}
.backdrop.show{background:rgba(15,12,8,.72)}
.backdrop.fading{background:rgba(15,12,8,0)}
.sheet .emoji.swing{animation:swing 1.4s cubic-bezier(.3,1.5,.5,1) both;transform-origin:50% -9px}
@keyframes swing{0%{transform:translateY(-40px) rotate(-25deg);opacity:0}30%{opacity:1}55%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}90%{transform:rotate(2deg)}to{transform:none}}
.sheet .stag{animation:stag .5s ease-out both}
@keyframes stag{from{opacity:0;transform:translateY(10px)}}
.sheet.twinkle::before{animation:twinkle 1.6s steps(2) 2}
@keyframes twinkle{50%{filter:brightness(1.35) saturate(1.2)}}
input[type=range]{accent-color:var(--bronze2)}

/* Schneehäubchen: liegt auf jeder Tür, fällt beim Hovern oder Öffnen herunter und wächst später nach */
.door .cap{position:absolute;left:5px;right:5px;top:-7px;height:22px;z-index:2;pointer-events:none;transform-origin:50% 35%;--lv:0;transform:scale(calc(.55 + var(--lv)*.45),var(--lv));opacity:min(1,calc(var(--lv)*3));transition:transform .3s linear}
.door .cap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.door .cap.fall{animation:capfall .9s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes capfall{from{transform:scale(calc(.55 + var(--lv)*.45),var(--lv));opacity:1}to{transform:translateY(70px) rotate(8deg) scaleY(.6);opacity:0}}

/* Wettrennen (15) */
.race{margin-top:12px}
.race .row{display:grid;grid-template-columns:5.5rem 1fr 4.2rem;gap:10px;align-items:center;margin:10px 0;font-size:.9rem}
.race .track{height:18px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.race .bar{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--bronze2),var(--bronze))}
.race .bar.fast{background:linear-gradient(90deg,#2f5d45,#6f9a5e)}
.race .t{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pipe{display:flex;gap:3px;height:30px;border-radius:8px;overflow:hidden;background:var(--line);margin-top:8px}
.pipe span{flex:0 0 calc(25% - 2.25px);display:grid;place-items:center;background:#e9dfcd;font-size:.95rem;opacity:0;transform:translateX(-12px);transition:.4s}
.pipe.on span{opacity:1;transform:none}
/* Link aufdecken (19) */
.mail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;position:relative;font-size:.94rem}
.fake{color:#1a5fb4;text-decoration:underline;cursor:pointer;font-weight:600}
.status{position:relative;margin-top:12px;background:#2a241b;color:#f1f1ec;border-radius:8px;padding:8px 10px;font:500 .82rem ui-monospace,Menlo,monospace;word-break:break-all;opacity:0;transform:translateY(6px);transition:.25s}
.status.on{opacity:1;transform:none}
.status b{color:#ff8a7a}
/* Nachtmodus (21) */
#night{position:fixed;inset:0;pointer-events:none;z-index:30;background:#ff8c2a;mix-blend-mode:multiply;opacity:0;transition:opacity .15s}
.temp{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:4px}

/* Rheinpegel (11) */
.gauge{display:flex;gap:16px;align-items:stretch;margin-top:12px}
.gauge .col{position:relative;width:54px;height:150px;border-radius:10px;background:linear-gradient(#f7f3ea,#efe6d4);border:1px solid var(--line);overflow:hidden;flex:none}
.gauge .water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#5d8fb3,#2f5f86);transition:height 1.6s cubic-bezier(.2,.8,.3,1)}
.gauge .water::before{content:"";position:absolute;left:-50%;width:200%;top:-6px;height:12px;background:radial-gradient(circle at 10px -2px,transparent 8px,#5d8fb3 9px) 0 0/20px 12px repeat-x;animation:wave 2.4s linear infinite}
@keyframes wave{to{transform:translateX(20px)}}
.gauge .ticks{position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 14px,rgba(42,36,27,.15) 14px 15px)}
.gauge .info{display:flex;flex-direction:column;justify-content:center;gap:4px}
.gauge .cm{font:400 2.2rem/1 var(--serif)}

/* Großes Fenster: alles auf einen Blick. 8×5 Felder, die Überschrift sitzt mittig oben (4×2),
   die Türchen verteilen sich drumherum: 24 (2×2), 1, 12, 18, 7, 22 breit → 32 + 8 = 40 Felder */
@media(min-width:1000px) and (min-height:620px){
 main{max-width:none;height:100svh;display:flex;flex-direction:column;padding:16px 24px 10px}
 .grid{flex:1;min-height:0;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);gap:14px}
 .door{aspect-ratio:auto}
 .door.wide-x{grid-column:span 2}
 header.head{grid-column:3/7;grid-row:1/3;margin:0;display:flex;flex-direction:column;justify-content:center;padding:0 12px}
 header.head h1{font-size:clamp(2.4rem,4.2vw,4.4rem)}

 .door .num{font-size:clamp(1.6rem,2.6vw,2.6rem)}

 3:{e:"🎣",t:"Phishing oder echt?",q:{f:"Diese Mail landet bei dir im Postfach:</p><div class='box' style='font-size:.92rem'><div class='muted'>Von: <b style='color:var(--ink)'>DHL Paketservice</b> &lt;noreply@dhl-zustellung-info.top&gt;</div><div class='muted'>Betreff: Ihre Sendung wartet</div><p style='margin:.6em 0 0'>Ihr Paket konnte nicht zugestellt werden. Bitte zahlen Sie die Zollgebühr von 1,99 € unter folgendem Link …</p></div><p>Echt oder Phishing?",o:["Echt, kenn ich so","Phishing"],a:1,x:"Phishing! Der Name „DHL Paketservice“ ist frei erfunden – den kann jeder Absender eintragen. Entscheidend ist die Adresse dahinter: <b>dhl-zustellung-info.top</b> gehört nicht DHL (die schreibt von dhl.de).<br><br><b>So prüfst du den Absender:</b><br>• Auf den Namen tippen bzw. klicken – erst dann zeigt das Handy die echte Adresse.<br>• Auf den Teil nach dem @ achten, vor allem auf das Ende: dhl.de ist echt, dhl.de-paket.info oder dhl-service.top nicht.<br>• Kleine Tippfehler wie paypa1.com oder arnazon.de sind ein klassischer Trick.<br>• Im Zweifel nie den Link in der Mail nutzen, sondern die App oder Webseite selbst öffnen."}},

 5:{e:"⌨️",t:"Tab weg? Kein Drama",b:"<p>Beim Geschenke-Suchen aus Versehen den Tab mit dem perfekten Fund geschlossen? So holst du ihn zurück:</p><p style='text-align:center;font-size:1.15rem'><kbd>Strg</kbd> + <kbd>Shift</kbd> + <kbd>T</kbd></p><p class='muted' style='text-align:center'>Am Mac: <kbd>⌘</kbd> + <kbd>Shift</kbd> + <kbd>T</kbd></p><p>Mehrmals drücken holt nacheinander auch die Tabs davor zurück. Klappt in Chrome, Firefox, Edge und Safari.</p>"},

 7:{e:"💾",t:"Die 3-2-1-Regel",b:"<p>Die schönsten Weihnachtsfotos sind nur so sicher wie ihr Speicherort. Die Faustregel:</p><ul><li><b>3</b> Kopien deiner Daten,</li><li>auf <b>2</b> verschiedenen Speichern (z. B. Laptop und externe Festplatte),</li><li><b>1</b> davon außer Haus (Cloud oder bei den Eltern).</li></ul><p><b>Warum?</b> Festplatten gehen ohne Vorwarnung kaputt, Handys gehen verloren, und ein Wasserschaden erwischt alles im selben Raum. Mit drei Kopien an zwei Orten bleibt immer eine übrig.</p>",sys:"backup"},
 8:{e:"📶",t:"Ein WLAN für die Gäste",b:"<p>Über die Feiertage kommt Besuch, und die erste Frage lautet: „Wie ist euer WLAN-Passwort?“</p><p><b>Tipp:</b> Richte ein eigenes Gäste-WLAN ein. Bei den meisten Routern (z. B. der Fritzbox unter „WLAN → Gastzugang“) dauert das zwei Minuten.</p><p><a class='btn primary' style='text-decoration:none;display:inline-block' href='http://fritz.box' target='_blank' rel='noopener'>Fritzbox öffnen</a> <span class='muted'>(nur wenn du eine Fritzbox hast und gerade zu Hause im WLAN bist. Bei anderen Routern steht die Adresse meist auf dem Aufkleber unten am Gerät.)</span></p><p><b>Warum?</b> Gäste kommen ins Internet, aber nicht an deinen Drucker, dein NAS oder deine Kameras. Und falls ein Gerät der Gäste Schadsoftware mitbringt, bleibt sie draußen.</p>"},

 12:{e:"🖥️",t:"Der perfekte Tag für eine neue Webseite",b:"<p>Draußen ist es grau, drinnen gibt's Plätzchen – Zeit für das Projekt, das seit Jahren auf der Liste steht.</p><p>In unserer <b>Demo</b> klickst du dir eine Beispielseite zusammen: Texte ändern, Bilder tauschen, Öffnungszeiten eintragen. Ganz ohne Anmeldung, und nichts davon wird veröffentlicht.</p><p style='text-align:center;margin-top:16px'><a class='btn primary' style='text-decoration:none;display:inline-block' href='https://kalkar-it.de/kundenportal/demo' target='_blank' rel='noopener'>Demo ausprobieren</a></p><p class='muted'>Gut zu wissen: Eine eigene Webseite gehört dir – anders als ein Facebook-Profil, dessen Regeln sich jederzeit ändern können.</p>"},

 14:{e:"🔄",t:"Updates sind kleine Geschenke",b:"<p>Das Update-Fenster kommt immer im falschen Moment, ja. Trotzdem lohnt es sich.</p><p><b>Warum?</b> Die meisten Angriffe nutzen Lücken, die längst bekannt und behoben sind. Wer Updates aufschiebt, lässt die Tür offen, obwohl der Schlüssel schon bereitliegt.</p><p><b>Heute:</b> Handy, Computer und Router einmal aktualisieren. Am besten automatische Updates einschalten, dann musst du nie wieder dran denken.</p>",sys:"update"},
 15:{e:"🧮",t:"Bit oder Byte?",q:{f:"Dein Internetanschluss hat „100 Mbit/s“. Wie viele Megabyte kommen davon ungefähr pro Sekunde an?",o:["100 MB pro Sekunde","Etwa 12,5 MB pro Sekunde","1 GB pro Sekunde"],a:1,x:"Etwa 12,5 MB! Ein Byte hat 8 Bit, also 100 ÷ 8. Darum zeigt der Download-Balken weniger an, als der Vertrag verspricht – das ist kein Fehler.<br><br><b>Was schaffen 100 Mbit/s?</b><br>• 4 Filme in 4K gleichzeitig streamen (je ca. 25 Mbit/s)<br>• rund 20 Videoanrufe gleichzeitig (je ca. 4 Mbit/s)<br>• ein Spiel mit 50 GB laden: etwa eine Stunde<br><br><b>Und 1 Gbit/s?</b> Zehnmal so schnell, das 50-GB-Spiel ist in gut 7 Minuten da. Beim Streamen oder Surfen merkst du davon kaum etwas, denn mehr als 4K gibt's nicht.<br><br><b>Worauf es oft mehr ankommt:</b> den <b>Upload</b> (wichtig fürs Homeoffice, Fotos in die Cloud, Videoanrufe) und ein gutes <b>WLAN</b> im Haus. Die schnellste Leitung bringt nichts, wenn der Router im Keller steht.<br><br><span class='muted'>Faustregel: Für die meisten Haushalte reichen 100 bis 250 Mbit/s. Mehr lohnt sich bei vielen Leuten im Haus, großen Downloads oder viel Upload.</span>"},fx:"race"},
 16:{e:"🍪",t:"Plätzchen-Wettessen",w:"cookie"},
 17:{e:"📸",t:"Fotos richtig sichern",b:"<p>Ein Handy ist kein Fotoalbum. Es fällt runter, wird gestohlen oder landet im Glühwein, und mit ihm die Bilder.</p><p><b>Tipp:</b> Schalte ein automatisches Backup ein, zum Beispiel iCloud-Fotos, Google Fotos oder dein eigenes NAS zu Hause.</p><p><b>Gut zu wissen:</b> Prüfe einmal, ob das Backup wirklich läuft. Oft ist der Speicher seit Monaten voll, und keiner hat's gemerkt.</p>",sys:"fotos"},
 18:{e:"🌳",t:"Kalkar-Rätsel",q:{f:"Was steht in der Mitte des Kalkarer Marktplatzes?",o:["Ein Marktbrunnen","Die Gerichtslinde","Ein Weihnachtsbaum aus Stein"],a:1,x:"Die Gerichtslinde! Unter Linden wurde früher Recht gesprochen – heute ist sie das grüne Herz des Marktes."}},
 19:{e:"🔗",t:"Erst schauen, dann klicken",b:"<p>Links in Mails und Nachrichten zeigen nicht immer dorthin, wo sie zu stehen scheinen. Probier's aus:</p><div class='mail'><div class='muted' style='font-size:.85rem'>Von: Paketdienst &lt;info@paket-benachrichtigung.top&gt;</div><p style='margin:.6em 0 0'>Gute Nachricht! Deine Sendung ist morgen bei dir. <span class='fake' id='fl' tabindex='0'>Sendung verfolgen</span></p><div class='status' id='fs'>https://<b>sendung-verfolgen.paketinfo-24.top</b>/track?id=DE4471</div></div><p class='muted' id='fh'></p><p><b>Warum?</b> Der Text „Sendung verfolgen“ kann zu jeder beliebigen Seite führen. Erst die Adresse verrät, wohin es wirklich geht. Passt sie nicht zum Absender: Finger weg.</p>",fx:"link"},
 20:{e:"🔢",t:"Wie lange zum Knacken?",w:"crack"},
 21:{e:"🌙",t:"Der kürzeste Tag",b:"<p>Heute ist Wintersonnenwende. Ab morgen werden die Tage wieder länger!</p><p><b>Tipp:</b> Schalte den Nachtmodus ein und stell ihn auf „Sonnenuntergang bis Sonnenaufgang“. Dann wird der Bildschirm abends von selbst wärmer. Probier mal, wie das aussieht:</p><input type='range' id='nr' min='0' max='100' value='0' style='width:100%' aria-label='Farbtemperatur'><div class='temp'><span>❄️ kühl</span><span>wärmer 🕯️</span></div><p><b>Warum?</b> Das warme Licht ist am Abend angenehmer für die Augen, und vielen fällt das Einschlafen leichter.</p>",sys:"night",fx:"night"},
 22:{e:"👵",t:"Technik-Check unterm Tannenbaum",b:"<p>An den Feiertagen sitzt die Familie zusammen. Eine gute Gelegenheit, bei Eltern und Großeltern kurz aufs Handy zu schauen:</p><ul><li><b>Updates aktuell?</b> Ältere Geräte bekommen sonst keine Sicherheitslücken mehr geschlossen.</li><li><b>Backup an?</b> Damit die Enkelfotos nicht mit dem Handy verloren gehen.</li><li><b>Notfallpass ausgefüllt?</b> Im Notfall sehen Rettungskräfte dann Vorerkrankungen und wen sie anrufen sollen, auch ohne Code.</li></ul><p class='muted'>Zehn Minuten, die viel Ärger ersparen – und ein schönes Geschenk, das nichts kostet.</p>",sys:"notfall"},
 23:{e:"🧹",t:"Digitaler Hausputz",b:"<p>Vor den Feiertagen wird geputzt, warum nicht auch auf dem Handy? Fünf Minuten genügen:</p><ul><li>Apps löschen, die du seit einem Jahr nicht geöffnet hast.</li><li>Den Download-Ordner leeren.</li><li>Newsletter abbestellen, die du nie liest.</li></ul><p><b>Warum?</b> Jede App, die du nicht nutzt, kann trotzdem Daten sammeln oder eine Lücke haben. Und mehr Speicherplatz für die Weihnachtsfotos gibt's obendrauf.</p>",sys:"speicher"},

function capDrop(b){const c=b.querySelector(".cap");if(!c||c.classList.contains("fall")||(c.lv||0)<.02)return;
  c.classList.add("fall");
  const r=b.getBoundingClientRect();puff(r.left,r.top,r.width*c.lv);
  setTimeout(()=>{c.lv=0;c.style.setProperty("--lv",0);c.classList.remove("fall")},900);}
// Schnee sammelt sich erst ab dem Öffnen der Seite – je mehr Flocken fallen, desto schneller
// (Standard ca. 2 Minuten bis zur vollen Haube; mit dem Regler in Türchen 9 entsprechend schneller)
setInterval(()=>{const rate=(flakes.length/120)*0.0042*(SZENE?6:1);if(!rate)return;
  document.querySelectorAll(".door .cap:not(.fall)").forEach(c=>{const v=Math.min(1,(c.lv||0)+rate*(.7+Math.random()*.6));c.lv=v;c.style.setProperty("--lv",v.toFixed(3))})},500);
const TOUCH=matchMedia("(hover: none)").matches;
const grid=document.getElementById("grid");
// Am Handy gibt es kein Hovern: Mit dem Finger über die Türen wischen schüttelt den Schnee ab
grid.addEventListener("touchmove",e=>{const t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY)?.closest(".door");if(el)capDrop(el)},{passive:true});
order.forEach(d=>{
  const b=document.createElement("button");
  b.className="door"+(d===24?" big":d===1?" wide":(d===12||d===18)?" wide-d":(d===7||d===22)?" wide-x":"");
  const free=preview||d<=today;
  if(!free)b.classList.add("locked");
  if(d===today&&!opened.has(d))b.classList.add("today");
  if(opened.has(d)&&free)b.classList.add("open");
  b.setAttribute("aria-label",`Türchen ${d}`+(free?"":" – noch verschlossen"));
  b.innerHTML=`<span class="inner" data-peek="${DAYS[d].e}"></span><span class="leaf">${MOTIF[d]?`<span class="motif" aria-hidden="true">${M[MOTIF[d]]}</span>`:""}<span class="num">${d}</span></span>${CAP()}`;
  b.addEventListener("mouseenter",()=>capDrop(b));
  b.onclick=()=>{
    capDrop(b);
    if(!free){shake(b);return}
    b.classList.add("open");b.classList.remove("today");opened.add(d);save();
    b.classList.add("glow");setTimeout(()=>{show(d,b);b.classList.remove("glow")},reduce?0:(b.dataset.seen?250:750));b.dataset.seen=1;
  };
  grid.appendChild(b);
});
document.getElementById("hint").textContent=TOUCH?"Psst: Wisch mal mit dem Finger über die Türchen ❄️":"Psst: Fahr mal mit der Maus über die Türchen ❄️";
document.getElementById("count").textContent=
  today===0?`Noch ${Math.ceil((new Date(YEAR,11,1)-now)/864e5)} Tage bis zum ersten Türchen`:
  today>24?"Alle Türchen sind offen – frohes Fest!":`Heute ist Türchen ${today} dran`;

function makeCard({emoji,kicker,big,label,sub}){
 const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");

 for(let x=24,i=0;x<W;x+=48,i++){g.fillStyle=col[i%3];g.beginPath();g.arc(x,40,13,0,6.28);g.fill()}
 g.fillStyle="rgba(255,255,255,.85)";for(let i=0;i<160;i++){const x=Math.random()*W,y=90+Math.random()*(H-90);if(y>160&&y<1460&&x>90&&x<W-90)continue;g.beginPath();g.arc(x,y,Math.random()*4+1.5,0,6.28);g.fill()}
 g.textAlign="center";g.fillStyle="#b8956a";g.font="500 40px -apple-system,Segoe UI,Roboto,sans-serif";g.fillText("Kalkar IT Solutions | Adventskalender 2026",W/2,220);
 g.fillStyle="#f1f1ec";g.font="44px -apple-system,Segoe UI,Roboto,sans-serif";g.fillText(kicker,W/2,290);
 g.beginPath();g.arc(W/2,620,210,0,6.28);g.fillStyle="#efe6d4";g.fill();g.lineWidth=14;g.strokeStyle="#b8956a";g.stroke();
 g.fillStyle="#92785a";g.fillRect(W/2-26,385,52,34);
 g.font="230px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";g.textBaseline="middle";g.fillText(emoji,W/2,640);g.textBaseline="alphabetic";
 g.fillStyle="#fff";
 if(/^\d+$/.test(big)){g.font="300px 'Iowan Old Style','Palatino Linotype',Georgia,serif";g.fillText(big,W/2,1170);
  g.font="64px 'Iowan Old Style','Palatino Linotype',Georgia,serif";g.fillText(label,W/2,1270)}
 else{g.font="92px 'Iowan Old Style','Palatino Linotype',Georgia,serif";const words=big.split(" "),lines=[];let l="";
  for(const w of words){const t=l?l+" "+w:w;if(g.measureText(t).width>W-160&&l){lines.push(l);l=w}else l=t}lines.push(l);
  lines.slice(0,4).forEach((t,i)=>g.fillText(t,W/2,1000+i*112+(4-Math.min(4,lines.length))*56))}

 return c}

    <div class="actions"><button class="btn" id="copy">Link kopieren</button><button class="btn" id="share">Für die Story</button><button class="btn primary" id="close">Schließen</button></div>`;
  bd.classList.remove("fading");bd.classList.add("show");
  if(!reduce){
    // Fenster wächst aus der Tür heraus (FLIP)
    const to=sheet.getBoundingClientRect();
    let from={x:0,y:60,s:.9};
    if(fromEl){const r=fromEl.getBoundingClientRect();from={x:(r.left+r.width/2)-(to.left+to.width/2),y:(r.top+r.height/2)-(to.top+to.height/2),s:Math.max(.12,r.width/to.width)}}
    sheet.animate([{transform:`translate(${from.x}px,${from.y}px) scale(${from.s}) rotate(-6deg)`,opacity:.2,borderRadius:"14px"},
      {transform:"translate(0,0) scale(1.03) rotate(.6deg)",opacity:1,offset:.7},{transform:"none",opacity:1}],
      {duration:650,easing:"cubic-bezier(.2,.9,.3,1.1)"});
    bd.animate([{background:"rgba(15,12,8,0)"},{background:"rgba(15,12,8,.72)"}],{duration:450});
    sheet.querySelector(".emoji").classList.add("swing");
    [...sheet.children].slice(1).forEach((c,i)=>{c.classList.add("stag");c.style.animationDelay=(280+i*70)+"ms"});
    sheet.classList.remove("twinkle");void sheet.offsetWidth;sheet.classList.add("twinkle");
    setTimeout(()=>burst(24),380);
  }
  if(x.q)sheet.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    sheet.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.i===x.q.a)o.classList.add("right")});
    if(+b.dataset.i!==x.q.a)b.classList.add("wrong");else burst();
    document.getElementById("qx").hidden=false;
    if(x.fx)FX[x.fx]();
  });
  if(x.w&&W[x.w].init)W[x.w].init();
  if(x.fx&&!x.q)FX[x.fx]();
  document.getElementById("close").onclick=hide;
  document.getElementById("copy").onclick=async e=>{const u="https://kalkar-it.de/advent/";try{await navigator.clipboard.writeText(u);e.target.textContent="Kopiert ✓"}catch(_){prompt("Link zum Kopieren:",u)}};

  document.getElementById("close").focus();
}

   <div class="box"><b>Der Haken an der Rechnung</b><p style="margin:.4em 0 0">Meist wird gar nicht geknackt. Wird ein Shop gehackt, landen die Passwörter oft im Klartext im Netz, und Angreifer probieren sie einfach bei Mail, Amazon und Bank aus. Dann hilft auch ein Passwort nichts, das „länger als das Universum“ hält – es sei denn, es gilt nur für dieses eine Konto. Wie man sich viele davon merkt, steht in <a href="#" onclick="return goDoor(2)" style="color:var(--bronze3);font-weight:600">Türchen 2</a>.</p></div>`,
   init(){const i=document.getElementById("ci"),o=document.getElementById("co");i.oninput=()=>o.textContent=i.value?crack(i.value):"–"}},
 nikolaus:{html:`<p>Heute Nacht war der Nikolaus unterwegs. Hast du deinen Stiefel geputzt? Dann tipp drauf und schau, was drin ist.</p><div class="big-emoji" id="boot">🥾</div><p id="nt" class="muted" style="text-align:center">&nbsp;</p>`,
   init(){const g=["🍫 Schokolade!","🍊 Eine Mandarine!","🥜 Nüsse!","🍬 Süßigkeiten!","🎁 Ein kleines Geschenk!"];document.getElementById("boot").onclick=e=>{const x=g[Math.random()*g.length|0].split(" ");e.target.textContent=x[0];document.getElementById("nt").textContent="Der Nikolaus war da: "+x.slice(1).join(" ");burst()}}},
 snow:{html:`<p>In Kalkar bleibt weiße Weihnacht meist ein Wunsch. Hier darfst du heute selbst für Schnee sorgen.</p><input type="range" id="sr" min="0" max="400" value="120" style="width:100%"><p class="muted">Schieb den Regler nach rechts – und dann genieß den Blick nach draußen.</p>`,
   init(){document.getElementById("sr").oninput=e=>setFlakes(+e.target.value)}},
 dice:{html:`<div class="big-emoji" id="die">🎲</div><p>Sechs kleine Kniffe, einer davon ist heute deiner.</p><div class="box" id="dt">Tipp auf den Würfel.</div><p style="text-align:right;margin:10px 0 0"><button class="btn" id="again" hidden>🎲 Nochmal würfeln</button></p>`,
   // jeder Tipp kommt erst wieder, wenn alle sechs dran waren
   init(){const d=document.getElementById("die"),ag=document.getElementById("again");let bag=[];
    const roll=()=>{if(!bag.length)bag=TIPS.map((_,i)=>i).sort(()=>Math.random()-.5);const tp=TIPS[bag.pop()];
     d.animate([{transform:"rotate(0)"},{transform:"rotate(720deg)"}],{duration:500});
     setTimeout(()=>{document.getElementById("dt").innerHTML=tp.t+(tp.x||"")+(tp.sys?sysBox(tp.sys).replace('class="box"','style="margin-top:10px"'):"");ag.hidden=false;ag.textContent=bag.length?"🎲 Nochmal würfeln":"🎲 Alle gesehen – von vorn"},450)};
    d.onclick=roll;ag.onclick=roll}},
 cookie:{html:`<p>Auf dem Teller liegen frische Plätzchen. Wie viele schaffst du in 10 Sekunden? Tipp so schnell du kannst!</p><div class="big-emoji" id="ck">🍪</div><p style="text-align:center;font-size:1.4rem" id="cn">0</p><p class="muted" style="text-align:center" id="cs">Erster Tipp startet die Uhr.</p><p style="text-align:center;margin:10px 0 0" id="cshare" hidden><button class="btn primary" id="cbtn">Ergebnis für die Story</button> <button class="btn" id="cagain">Nochmal</button></p>`,
   init(){let n=0,t0=0,done=false;const c=document.getElementById("ck"),cn=document.getElementById("cn"),cs=document.getElementById("cs");
    c.onclick=()=>{if(done)return;if(!t0){t0=Date.now();setTimeout(()=>{done=true;const best=Math.max(n,+store.get("kit-keks")||0);store.set("kit-keks",best);
      cs.textContent=n>=best&&n>0?`Zeit um! Neuer Rekord: ${n} 🍪`:`Zeit um! Dein Rekord: ${best} 🍪`;burst();document.getElementById("cshare").hidden=false;
      document.getElementById("cbtn").onclick=()=>shareCard({emoji:"🍪",kicker:"Türchen 16 · Plätzchen-Wettessen",big:String(n),label:n===1?"Plätzchen in 10 Sekunden":"Plätzchen in 10 Sekunden",sub:"Schaffst du mehr?",file:"plaetzchen-"+n+".png"});
      document.getElementById("cagain").onclick=()=>{n=0;t0=0;done=false;cn.textContent="0";cs.textContent="Erster Tipp startet die Uhr.";document.getElementById("cshare").hidden=true}},10000)}cn.textContent=++n}}},

 final:{html:`<p>24 Türchen, 24 kleine Überraschungen – danke, dass du jeden Tag vorbeigeschaut hast!</p><p>Wir wünschen dir und deinen Liebsten ein ruhiges, warmes Weihnachtsfest, Zeit füreinander und ein gutes neues Jahr. Und Technik, die einfach funktioniert – und sollte sie doch mal nicht machen, was du erwartest, weißt du jetzt, wo du dich melden kannst: <a href="https://www.kalkar-it.de" style="color:var(--bronze3);font-weight:600">www.kalkar-it.de</a></p><p style="font-family:var(--serif);font-size:1.15rem;margin-top:1em">Frohe Weihnachten aus Kalkar!<br><span class="muted" style="font-family:var(--sans)">Dein Team von Kalkar IT Solutions</span></p>`,

function score(p){if(!p)return 0;let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(p.length>=16)s++;if(/[^a-zA-Z]/.test(p)&&/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;return Math.max(1,Math.min(4,s))}
function crack(p){let c=0;if(/[a-z]/.test(p))c+=26;if(/[A-Z]/.test(p))c+=26;if(/\d/.test(p))c+=10;if(/[^a-zA-Z0-9]/.test(p))c+=33;
 const sec=Math.pow(c,p.length)/2/1e10;const u=[[31536e9,"Jahrtausende"],[31536e6,"Jahrtausend"],[31536e3,"Jahre"],[86400,"Tage"],[3600,"Stunden"],[60,"Minuten"],[1,"Sekunden"]];
 if(sec<1)return"sofort 😬";if(sec>31536e12)return"länger als das Universum alt ist ✨";
 for(const[d,n]of u)if(sec>=d){const v=Math.round(sec/d);return n==="Jahrtausende"||n==="Jahrtausend"?`ca. ${v.toLocaleString("de")} Jahrtausende`:`ca. ${v.toLocaleString("de")} ${n}`}}

// ---------- Schnee & Konfetti ----------
const cv=document.getElementById("snow"),cx=cv.getContext("2d");let flakes=[],sparks=[];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function rs(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize",rs);rs();
function setFlakes(n){while(flakes.length<n)flakes.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2.4+.6,s:Math.random()*.6+.3,d:Math.random()*6.28});flakes.length=n}
setFlakes(reduce?0:Math.min(120,innerWidth/8|0));
function puff(x,y,w){if(reduce)return;for(let i=0;i<26;i++)sparks.push({x:x+Math.random()*w,y:y+Math.random()*8,vx:(Math.random()-.5)*1.6,vy:Math.random()*-1.5,c:"#fff",l:70,r:0,f:1,s:Math.random()*2+1.2})}
function burst(n=60){if(reduce)return;const c=["#b8956a","#f1f1ec","#d4b48a","#8fb487","#c97a65"];for(let i=0;i<n;i++)sparks.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,c:c[i%5],l:90,r:Math.random()*360})}
(function loop(){cx.clearRect(0,0,innerWidth,innerHeight);cx.fillStyle="rgba(255,255,255,.8)";
 for(const f of flakes){f.y+=f.s;f.d+=.01;f.x+=Math.sin(f.d)*.4;if(f.y>innerHeight){f.y=-5;f.x=Math.random()*innerWidth}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.28);cx.fill()}
 sparks=sparks.filter(s=>s.l-->0);for(const s of sparks){if(s.f){s.x+=s.vx;s.y+=s.vy;s.vy+=.08;cx.globalAlpha=Math.min(1,s.l/30);cx.fillStyle="#fff";cx.beginPath();cx.arc(s.x,s.y,s.s,0,6.28);cx.fill();cx.globalAlpha=1;continue}s.x+=s.vx;s.y+=s.vy;s.vy+=.35;s.r+=8;cx.save();cx.translate(s.x,s.y);cx.rotate(s.r*.017);cx.fillStyle=s.c;cx.fillRect(-4,-2,8,4);cx.restore()}
 requestAnimationFrame(loop)})();

 const wait=ms=>new Promise(r=>setTimeout(r,ms));

  while(true){const p=Math.min(1,(performance.now()-t0)/ms);r.value=from+(to_-from)*p;r.oninput&&r.oninput({target:r});if(p>=1)break;await wait(30)}};

  async schnee(){await wait(1500);await open(9);await slide("sr",120,400,4000);await wait(800);hide();await wait(3000);await sweep([3,9,18,5,13,22],180)},
  async nacht(){await wait(1500);await open(21);await wait(800);await slide("nr",0,100,5000);await wait(1500);await slide("nr",100,0,2500)},
  async rathaus(){to(24,.2);await wait(6000);await open(24)}
 };
 (S[SZENE]||S.stille)();
}
