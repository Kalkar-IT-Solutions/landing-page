name: Deploy after a new Redaktion build
# Lives only in the branch redaktion-build of Kalkar-IT-Solutions/landing-page;
# tool/deploy/publish_web.sh puts it there with each web build, because push
# workflows run from the pushed branch. The FTP secrets for do.de only hold on
# main, so this starts the deploy workflow (pages.yml) on main, which picks
# the build up into /kundenportal/.
on:
  push:
    branches:
      - redaktion-build
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the deploy workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "${{ github.repository }}"
