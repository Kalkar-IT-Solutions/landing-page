name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same Hugo as Horizont and the other pages. Horizont comes in as a Hugo
      # module (go.mod); Hugo fetches it with the Go the runner image has.
      HUGO_VERSION: 0.154.5
      TZ: Europe/Berlin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      # The base URL follows the Pages settings: the github.io address until
      # the custom domain is set there, then kalkar-it.de.
      - name: Build the site
        run: hugo --gc --minify --baseURL "${BASE_URL}/"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      # Kalkar Kompakt (private repo Kalkar-IT-Solutions/kalkar-kompakt)
      # pushes its web build to the branch kompakt-build of this repo; it
      # is served at /kompakt/app/, below the teaser page at /kompakt/.
      # A build still made for /kompakt/ goes there and covers the teaser,
      # so the app keeps working until its next publish. Without that
      # branch the site still deploys.
      - name: Add Kalkar Kompakt
        run: |
          if git fetch --depth 1 origin kompakt-build; then
            dir=public/kompakt/app
            if ! git show FETCH_HEAD:index.html | grep -q '<base href="/kompakt/app/">'; then
              echo "::warning::kompakt-build is still built for /kompakt/, it covers the teaser."
              dir=public/kompakt
            fi
            mkdir -p "$dir"
            git --work-tree="$dir" checkout FETCH_HEAD -- .
            # The branch carries the workflow that started this run.
            rm -rf "$dir/.github"
          else
            echo "::warning::No branch kompakt-build, deploying without /kompakt/."
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
          # The upload job takes the site from this artifact, and do.de
          # needs the .htaccess; Pages ignores it.
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  # The move to the webspace at do.de: until the DNS switch the site goes to
  # both, Pages and do.de. The FTP secrets live in the environment
  # github-pages, which only main may use. The FTP user only sees the
  # directory of kalkar-it.de, so the site lands in its root. Only changed
  # files go up; the action keeps its state in .ftp-deploy-sync-state.json.
  upload:
    environment: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Fetch the built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
      - name: Unpack
        run: mkdir public && tar -xf artifact.tar -C public
      - name: Upload to do.de
        # The server (ProFTPD) wants the data connection to reuse the TLS
        # session of the control connection. Node does not manage that
        # with TLS 1.3 and the server drops the data socket, so TLS 1.2.
        env:
          NODE_OPTIONS: --tls-max-v1.2
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./
