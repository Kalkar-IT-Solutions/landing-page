name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same Hugo as Horizont and the other pages. Horizont comes in as a Hugo
      # module (go.mod); Hugo fetches it with the Go the runner image has.
      HUGO_VERSION: 0.154.5
      TZ: Europe/Berlin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      # The base URL follows the Pages settings: the github.io address until
      # the custom domain is set there, then kalkar-it.de.
      - name: Build the site
        run: hugo --gc --minify --baseURL "${BASE_URL}/"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
      # Kalkar Kompakt (Kalkar-IT-Solutions/kalkar-kompakt) builds its web
      # version into the release "web"; it is served at /kompakt/.
      # Without that file the site still deploys, just without the app.
      - name: Add Kalkar Kompakt
        run: |
          mkdir -p public/kompakt
          if curl -fsSL "https://github.com/Kalkar-IT-Solutions/kalkar-kompakt/releases/download/web/web.tar.gz" -o kompakt.tar.gz; then
            tar -xzf kompakt.tar.gz -C public/kompakt
          else
            echo "::warning::No web build of Kalkar Kompakt found, deploying without /kompakt/."
            rmdir public/kompakt
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
