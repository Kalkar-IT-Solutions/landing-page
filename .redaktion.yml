# What can be edited in Redaktion (kalkar-it.de/redaktion/). Layouts, styles,
# the Horizont module and the deploy stay with the developer. Keys of the
# front matter that are not listed here survive every save unchanged.
timezone: Europe/Berlin

singletons:
  - name: start
    label: Startseite
    icon: home
    file: content/_index.md
    fields:
      - { name: title, label: Titel der Seite, type: string, required: true }
      - { name: description, label: Beschreibung für Suchmaschinen, type: text }
      - name: aufbau
        label: Im Aufbau
        type: boolean
        hint: Zeigt nur den oberen Bereich; die Abschnitte darunter bleiben verborgen.
      - name: hero
        label: Kopf während des Aufbaus
        type: object
        fields:
          - { name: kennung, label: Kennung, type: string }
          - { name: title, label: Überschrift, type: string, required: true }
          - { name: text, label: Text, type: text, hint: Markdown erlaubt, etwa Links. }
          - { name: button, label: Knopf zum Kontaktformular, type: string, hint: Öffnet das Kontaktformular in einem Fenster. Leer lassen für keinen Knopf. }
      - name: heroFull
        label: Kopf der fertigen Seite
        type: object
        fields:
          - { name: kennung, label: Kennung, type: string }
          - { name: title, label: Überschrift, type: string, required: true }
          - { name: text, label: Text, type: text }
      - name: sections
        label: Abschnitte
        type: list
        fields:
          - { name: id, label: Anker, type: string, required: true, hint: "Kleinbuchstaben, für Links wie #kontakt" }
          - { name: kennung, label: Kennung, type: string }
          - { name: title, label: Überschrift, type: string, required: true }
          - { name: text, label: Text, type: text }
          - name: facts
            label: Fakten
            type: list
            fields:
              - { name: term, label: Begriff, type: string, required: true }
              - { name: value, label: Wert, type: string, required: true }

  - name: kompakt
    label: Kalkar Kompakt
    icon: info
    file: content/kompakt.md
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: description, label: Beschreibung, type: text }
      - name: hero
        label: Kopf
        type: object
        fields:
          - { name: kennung, label: Kennung, type: string }
          - { name: title, label: Überschrift, type: string, required: true }
          - { name: text, label: Text, type: text }
          - { name: note, label: Hinweis, type: string }

  - name: redaktion
    label: Redaktion (Produktseite)
    icon: article
    file: content/redaktion-webseiten.md
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: description, label: Beschreibung, type: text, hint: Für Suchmaschinen und die Zeile unter „Arbeiten“ auf der Startseite. }
      - name: arbeit
        label: Eintrag unter „Arbeiten“
        type: object
        fields:
          - { name: note, label: Zeile, type: string }
          - { name: status, label: Status, type: string }
      - name: hero
        label: Kopf
        type: object
        fields:
          - { name: kennung, label: Kennung, type: string }
          - { name: title, label: Überschrift, type: string, required: true }
          - { name: text, label: Text, type: text, hint: Markdown erlaubt, etwa Links. }
          - name: primary
            label: Hauptknopf
            type: object
            fields:
              - { name: label, label: Beschriftung, type: string, required: true }
              - { name: url, label: Ziel, type: string, required: true }
          - name: secondary
            label: Zweiter Knopf
            type: object
            fields:
              - { name: label, label: Beschriftung, type: string, required: true }
              - { name: url, label: Ziel, type: string, required: true }
      - name: vorschau
        label: Formular im Telefon
        type: object
        fields:
          - { name: kennung, label: Kennung, type: string }
          - { name: title, label: Überschrift, type: string, required: true }
          - name: felder
            label: Felder
            type: list
            fields:
              - { name: label, label: Beschriftung, type: string, required: true }
              - { name: wert, label: Wert, type: string, required: true }
          - { name: status, label: Status, type: string }
          - { name: knopf, label: Knopf, type: string }
      - name: sections
        label: Abschnitte
        type: list
        fields:
          - { name: id, label: Anker, type: string, required: true, hint: "Kleinbuchstaben, für Links wie #ablauf; „kontakt“ bekommt das Formular darunter" }
          - { name: kennung, label: Kennung, type: string }
          - { name: title, label: Überschrift, type: string, required: true }
          - { name: text, label: Text, type: text, hint: Markdown erlaubt, etwa Links. }
          - name: facts
            label: Fakten
            type: list
            fields:
              - { name: term, label: Begriff, type: string, required: true, hint: Kurz halten, höchstens etwa elf Zeichen. }
              - { name: value, label: Wert, type: string, required: true }
          - name: fragen
            label: Fragen und Antworten
            type: list
            hint: Statt der Fakten; nur im Abschnitt mit den häufigen Fragen.
            fields:
              - { name: frage, label: Frage, type: string, required: true }
              - { name: antwort, label: Antwort, type: text, required: true }
      - name: form
        label: Kontaktformular
        type: object
        fields:
          - { name: subject, label: Betreff des Mail-Links (ohne JavaScript), type: string, required: true }
          - { name: name, label: Beschriftung Name, type: string, required: true }
          - { name: namePlaceholder, label: Platzhalter Name, type: string }
          - { name: email, label: Beschriftung E-Mail, type: string, required: true }
          - { name: emailPlaceholder, label: Platzhalter E-Mail, type: string }
          - { name: message, label: Beschriftung Nachricht, type: string, required: true }
          - { name: messagePlaceholder, label: Platzhalter Nachricht, type: string }
          - { name: consent, label: Einwilligung, type: text, required: true }
          - { name: consentLink, label: Link zur Datenschutzerklärung, type: string }
          - { name: submit, label: Knopf, type: string, required: true }
          - { name: ok, label: Meldung nach dem Senden, type: string, required: true }
          - { name: error, label: Meldung bei Fehler, type: string, required: true }
          - { name: rate, label: Meldung bei zu vielen Anfragen, type: string }
          - { name: offline, label: Meldung ohne Verbindung, type: string }

  - name: impressum
    label: Impressum
    icon: legal
    file: content/impressum.md
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: body, label: Text, type: markdown }

  - name: datenschutz
    label: Datenschutz
    icon: privacy
    file: content/datenschutz.md
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: body, label: Text, type: markdown }
